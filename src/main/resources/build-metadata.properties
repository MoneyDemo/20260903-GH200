# Build provenance baked into the artifact by Maven resource filtering.
# The @...@ tokens are replaced at package time with the app.build.sha / app.build.time
# Maven properties (see pom.xml; CI passes -Dapp.build.sha / -Dapp.build.time).
# These values are read straight off the classpath by BuildMetadata, never through the
# Spring Environment, so a runtime APP_BUILD_SHA / APP_BUILD_TIME environment variable
# can never rewrite what /api/info reports about the running artifact.
app.build.sha=@app.build.sha@
app.build.time=@app.build.time@
