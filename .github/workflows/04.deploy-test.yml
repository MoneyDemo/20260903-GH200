# 04 - Deploy 到「測試環境」：SSH 部署到 on-prem VM 模擬環境
#
# 教學重點 (Module 1 / Module 5)
#   - environment: test  → 綁定 GitHub Environment，可掛保護規則與環境層級 secret
#   - 這是本課主要 VM 部署路徑：GitHub-hosted runner 透過 SSH 把 jar 推到 Ubuntu VM
#   - VM 在這裡模擬 on-prem server；需要開放 inbound TCP/22，並在 GitHub Secret 保存長期私鑰
#   - 這種方式直覺、好懂，但要負責金鑰輪替、來源 IP 控制與主機指紋釘選
#   - 主機指紋必須預先寫在 vars.VM_SSH_HOST_KEY；workflow 不使用動態掃描避免信任首次連線
#   - build job 不接觸 SSH 私鑰；deploy job 才拿到憑證，降低不可信 build 指令外洩金鑰的風險
name: 04.deploy-test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simpleweb-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 原 release tag: actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # 原 release tag: actions/setup-java@v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'

      # build 時把完整 commit SHA 與 UTC 時間烤進 artifact，之後由 /api/info 佐證
      - name: Build and test
        run: ./mvnw -B verify -Dapp.build.sha="$GITHUB_SHA" -Dapp.build.time="$(date -u +%FT%TZ)"

      - name: Upload deployable jar
        # 原 release tag: actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error

  deploy-test:
    runs-on: ubuntu-latest
    needs: build
    # 這一行讓 run 出現在 Environments 頁面，也是套用保護規則的依據
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080

    steps:
      # 原 release tag: actions/download-artifact@v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: simpleweb-jar
          path: ./dist

      - name: Set up pinned SSH identity
        id: ssh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.VM_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/simpleweb-ssh"
          key_file="$ssh_dir/id_deploy"
          known_hosts="$ssh_dir/known_hosts"
          mkdir -p "$ssh_dir"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_HOST_KEY" > "$known_hosts"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$known_hosts" >> "$GITHUB_OUTPUT"

      - name: Check SSH connectivity
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          VM_USER: ${{ vars.VM_SSH_USER }}
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$KEY_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )
          if ! [[ "$VM_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "vars.VM_SSH_USER 格式無效。" >&2
            exit 1
          fi
          IFS=. read -r octet1 octet2 octet3 octet4 extra <<< "$VM_HOST"
          if [ -n "${extra:-}" ] || [ -z "${octet4:-}" ]; then
            echo "vars.VM_PUBLIC_IP 必須是 IPv4 位址。" >&2
            exit 1
          fi
          for octet in "$octet1" "$octet2" "$octet3" "$octet4"; do
            if ! [[ "$octet" =~ ^[0-9]{1,3}$ ]] || [ "$octet" -gt 255 ]; then
              echo "vars.VM_PUBLIC_IP 必須是有效的 IPv4 位址。" >&2
              exit 1
            fi
          done
          if ! ssh "${ssh_opts[@]}" -- "$VM_USER@$VM_HOST" 'true'; then
            echo "SSH 連線失敗：請確認 VM 已啟動，且 TCP/22 已允許從 GitHub-hosted runner 連入。" >&2
            echo "排除方式：確認 VM 電源已開；TCP/22 已由 Terraform 以持久的 AllowSshFromAzureCloud 規則對來源 AzureCloud 開放（若被政策移除，請講師手動還原同一條規則），切勿改開放整個 Internet。" >&2
            exit 1
          fi

      - name: Copy jar to VM
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          VM_USER: ${{ vars.VM_SSH_USER }}
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          remote_jar="simpleweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}.jar"
          ssh_opts=(
            -i "$KEY_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )
          scp "${ssh_opts[@]}" -- ./dist/simpleweb.jar "$VM_USER@$VM_HOST:$remote_jar"
          echo "REMOTE_JAR=$remote_jar" >> "$GITHUB_ENV"

      - name: Install and restart test service
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          VM_USER: ${{ vars.VM_SSH_USER }}
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$KEY_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )
          ssh "${ssh_opts[@]}" -- "$VM_USER@$VM_HOST" bash -s -- "$REMOTE_JAR" "/opt/simpleweb/test/simpleweb.jar" "simpleweb-test" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staged_jar="$1"
          target_jar="$2"
          service_name="$3"
          cleanup() {
            rm -f -- "$HOME/$staged_jar"
          }
          trap cleanup EXIT
          sudo install -o simpleweb -g simpleweb -m 0644 "$HOME/$staged_jar" "$target_jar"
          sudo systemctl restart "$service_name"
          sleep 5
          sudo systemctl is-active "$service_name"
          REMOTE_SCRIPT

      - name: Clean up SSH key
        if: always()
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
        run: |
          set -euo pipefail
          rm -f -- "$KEY_FILE"

      # 部署完一定要驗證實際版本，不要只看 workflow 綠燈或 HTTP 200。
      - name: Smoke test
        shell: bash
        env:
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body=''
          for i in $(seq 1 10); do
            body="$(curl -fsS "http://$VM_HOST:8080/api/info" || true)"
            actual_sha="$(BODY="$body" python3 -c 'import json, os; print(json.loads(os.environ["BODY"])["buildSha"])' 2>/dev/null || true)"
            if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
              echo "$body"
              echo "" && echo "測試環境部署成功"
              exit 0
            fi
            echo "等待應用程式啟動... ($i/10)" && sleep 6
          done
          echo "應用程式在時間內沒有回報這次完整 commit SHA：$EXPECTED_SHA" >&2
          echo "最後回應：$body" >&2
          exit 1
