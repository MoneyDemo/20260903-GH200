# ---------------------------------------------------------------------------
# Lab 05 starter — Promote 到 production（核准關卡）
#
# 目的地：.github/workflows/lab05-deploy-prod.yml
#
# 這是 build once, promote 模式，對應實際課堂使用的 workflow 05：
#   guard       → 驗證 confirm=deploy 與 build_sha 是否為合法的 40 字元十六進位
#   deploy-prod → 只用 actions:read 去找 workflow lab04-deploy-test.yml 已經跑成功的那個 run，
#                 下載它的 simpleweb-jar，完全不重新 build、也不重新部署 test
#
# 事前準備：
#   Repository variables : VM_PUBLIC_IP / VM_SSH_USER / VM_SSH_HOST_KEY
#   Environment secret   : VM_SSH_PRIVATE_KEY（設在 test 與 production 兩個 Environment，
#                          不是 repository secret）
#   GitHub Environment   : production（實際 approval gate 由講師在 class repo 示範；學員這份
#                          YAML 只做設計／review，不在自己的 fork 加 reviewer）
#
# 目標環境契約（不可改）：
#   prod → simpleweb-prod，8081，/opt/simpleweb/prod/simpleweb.jar
#          目錄是 prod，不是 production；environment 名稱才是 production。
# ---------------------------------------------------------------------------
name: Lab05 Promote to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 輸入 deploy 以確認要部署到正式環境
        required: true
        default: ''
      build_sha:
        description: 要 promote 的完整 40 字元 commit SHA
        required: true

permissions: {}

concurrency:
  group: simpleweb-deploy
  cancel-in-progress: false

