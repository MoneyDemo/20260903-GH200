# Lab 07 starter（選修 / 觀察與設計）— self-hosted runner【唯讀參考範本】
#
# ⚠️ 這是「唯讀參考／設計骨架」，用來閱讀與在設計筆記中補齊，**不是拿來實跑的**。
#    - 不要把它註冊到任何 runner，也不要指向共用的課程 VM。
#    - 課堂唯一的 live same-VM runner demo 由講師在私有 MoneyYu/GH-200 的常駐 runner 上進行；
#      本 public class repo 的 08.selfhosted-runner 是惰性參考範本（if: ${{ false }}，永遠跳過）。
#    - 若要課後親手實驗，只能在經講師同意的「另一台隔離機器 + 另一個獨立 private repo」上做，
#      絕不使用課程 VM 或課程 repo／其 fork（見 lab07-selfhosted-runner.md 的 F 段）。
#
# ⚠️ 安全提醒：self-hosted runner 絕對不可以用來執行不受信任的 fork PR。
#    這個 workflow 只使用 workflow_dispatch，不要加上 pull_request 觸發。
#
# 這份範本示範 workflow 08 同一台 VM 本機部署的模式（供閱讀／設計對照）：
#   build（把完整 commit SHA 烤進 artifact）→ 本機安裝並重啟 simpleweb-test（不需要 SSH）
#   → 本機語義化 exact-SHA smoke test
# ---------------------------------------------------------------------------

name: Lab07 Self-hosted Runner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simpleweb-deploy
  cancel-in-progress: false

