# ---------------------------------------------------------------------------
# Lab 04 starter — 用 SSH 部署到 test 環境
#
# 目的地：.github/workflows/lab04-deploy-test.yml
#
# 事前準備（講師會在課堂上給你實際值）：
#   Repository variables : VM_PUBLIC_IP / VM_SSH_USER / VM_SSH_HOST_KEY
#   Environment secret   : VM_SSH_PRIVATE_KEY（部署用的長期私鑰；分別設在 test 與
#                          production 兩個 Environment，不要放成 repository secret，
#                          這樣任意分支的 job 讀不到這把可 sudo 的長期私鑰）
#   GitHub Environment   : test
#
# 目標環境契約（不可改）：
#   test → systemd service `simpleweb-test`，port 8080，
#          jar 放在 /opt/simpleweb/test/simpleweb.jar
#
# ⚠️ 三個一定要做到的安全點（starter 已用註解標好）：
#   1. build job 不碰 SSH 私鑰；deploy job 才拿到憑證。
#   2. 主機指紋用 vars.VM_SSH_HOST_KEY 事先釘選，不要用 ssh-keyscan 動態信任首次連線。
#   3. build 時把 commit SHA/時間烤進 jar；部署端「不要」再寫任何 APP_BUILD_* 環境檔。
# ---------------------------------------------------------------------------
name: Lab04 Deploy to Test

on:
  workflow_dispatch:

# workflow 層級維持最小權限。
permissions:
  contents: read

concurrency:
  # 與 workflow 04/05/06/08 及 lab05/lab07 共用同一把部署鎖，避免同時重啟同一個服務。
  group: simpleweb-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 用不可變的 40-hex commit SHA 釘選 action（原 release tag: actions/checkout@v5）。
      # 這是特權部署 workflow，不要把可變 tag 複製進來。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # 原 release tag: actions/setup-java@v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'

      # TODO 1: build 時把完整 commit SHA 與 UTC 時間烤進 jar，
      #   讓 /api/info 之後可以佐證版本：
