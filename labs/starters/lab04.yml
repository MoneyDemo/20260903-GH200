# ---------------------------------------------------------------------------
# Lab 04 starter — 用 SSH 部署到 test 環境
#
# 目的地：.github/workflows/lab04-deploy-test.yml
#
# 事前準備（講師會在課堂上給你實際值）：
#   Repository variables : VM_PUBLIC_IP / VM_SSH_USER / VM_SSH_HOST_KEY
#   Repository secret    : VM_SSH_PRIVATE_KEY（部署用的長期私鑰）
#   GitHub Environment   : test
#
# 目標環境契約（不可改）：
#   test → systemd service `simpleweb-test`，port 8080，
#          jar 放在 /opt/simpleweb/test/simpleweb.jar
#
# ⚠️ 三個一定要做到的安全點（starter 已用註解標好）：
#   1. build job 不碰 SSH 私鑰；deploy job 才拿到憑證。
#   2. 主機指紋用 vars.VM_SSH_HOST_KEY 事先釘選，不要用 ssh-keyscan 動態信任首次連線。
#   3. build 時把 commit SHA/時間烤進 jar；部署端「不要」再寫任何 APP_BUILD_* 環境檔。
# ---------------------------------------------------------------------------
name: Lab04 Deploy to Test

on:
  workflow_dispatch:

# workflow 層級維持最小權限。
permissions:
  contents: read

concurrency:
  group: simpleweb-lab-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

