      #   釘選成不可變 SHA（原 tag @v7）：
      #     uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131

      # TODO 6: 把 secrets.VM_SSH_PRIVATE_KEY 與 vars.VM_SSH_HOST_KEY 寫進 $RUNNER_TEMP，
      #   一定要先 `umask 077`，並把 known_hosts 指向 vars.VM_SSH_HOST_KEY（釘選指紋）。

      # TODO 7: scp jar 上 VM，再 ssh 進去 install + systemctl restart simpleweb-test。
      #   要點：
      #     - ssh/scp 一律加上：
      #         -o StrictHostKeyChecking=yes
      #         -o UserKnownHostsFile=<剛剛寫的 known_hosts>
      #         -o GlobalKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=15
      #     - destination（user@host）放在 `--` 之後
      #     - 遠端腳本用 `set -euo pipefail`，並 trap 清掉暫存 jar
