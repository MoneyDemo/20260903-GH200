name: Lab04 Deploy to Test

# 目的地：.github/workflows/lab04-deploy-test.yml
#
# 事前準備（講師會在課堂上給你實際值）：
#   Repository variables : VM_PUBLIC_IP / VM_SSH_USER / VM_SSH_HOST_KEY
#   Environment secret   : VM_SSH_PRIVATE_KEY（部署用的長期私鑰；設在 test 與 production
#                          兩個 Environment，不是 repository secret）
#   GitHub Environment   : test
#
# 目標環境契約（不可改）：
#   test → systemd service `simpleweb-test`，port 8080，
#          jar 放在 /opt/simpleweb/test/simpleweb.jar
#
# 設計重點：
#   build job 不接觸 SSH 私鑰；deploy job 才拿到憑證。
#   build 時把完整 commit SHA / UTC 時間烤進 jar（-Dapp.build.*），
#   之後由 /api/info 佐證，部署端不再改寫 build metadata。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simpleweb-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 原 release tag: actions/checkout@v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      # 原 release tag: actions/setup-java@v6
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./mvnw -B verify -Dapp.build.sha="$GITHUB_SHA" -Dapp.build.time="$(date -u +%FT%TZ)"

      - name: Upload deployable jar
        # 原 release tag: actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error

  deploy-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080/
    steps:
      # 原 release tag: actions/download-artifact@v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: simpleweb-jar
          path: ./dist

      # 私鑰與釘選的主機指紋都只寫進 runner 的暫存目錄，權限 0600。
      - name: Set up pinned SSH identity
        id: ssh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.VM_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/simpleweb-ssh"
          mkdir -p "$ssh_dir"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_deploy"
          printf '%s\n' "$SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          echo "key_file=$ssh_dir/id_deploy" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"

      - name: Copy jar and restart service
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          VM_USER: ${{ vars.VM_SSH_USER }}
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 釘選主機指紋、關閉 agent、明確逾時；destination 放在 -- 之後避免選項注入。
          ssh_opts=(
            -i "$KEY_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )
          # 驗證使用者名稱與 IP，避免把奇怪的值拼進 ssh 指令。
          if ! [[ "$VM_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "vars.VM_SSH_USER 格式無效。" >&2
            exit 1
          fi
          if ! [[ "$VM_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "vars.VM_PUBLIC_IP 必須是 IPv4 位址。" >&2
            exit 1
          fi
          remote_jar="simpleweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jar"
          scp "${ssh_opts[@]}" -- ./dist/simpleweb.jar "$VM_USER@$VM_HOST:$remote_jar"
          ssh "${ssh_opts[@]}" -- "$VM_USER@$VM_HOST" bash -s -- "$remote_jar" "simpleweb-test" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staged_jar="$1"
          service_name="$2"
          trap 'rm -f -- "$HOME/$staged_jar"' EXIT
          sudo install -o simpleweb -g simpleweb -m 0644 "$HOME/$staged_jar" /opt/simpleweb/test/simpleweb.jar
          sudo systemctl restart "$service_name"
          sleep 5
          sudo systemctl is-active "$service_name"
          REMOTE_SCRIPT

      - name: Clean up SSH key
        if: always()
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
        run: rm -f -- "$KEY_FILE"

      # 只檢查 HTTP 200 是不夠的：舊版本還活著時一樣回 200。
      # 一定要確認 /api/info 的 buildSha 等於這次的 commit。
      - name: Smoke test
        shell: bash
        env:
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            body="$(curl -fsS --max-time 5 "http://$VM_HOST:8080/api/info" || true)"
            actual="$(BODY="$body" python3 -c 'import json,os;print(json.loads(os.environ["BODY"])["buildSha"])' 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "$body"
              echo "測試環境已更新到 $EXPECTED_SHA"
              exit 0
            fi
            echo "等待服務更新中... ($i/12)"
            sleep 5
          done
          echo "服務未在時間內回報預期的 build SHA：$EXPECTED_SHA" >&2
          exit 1
