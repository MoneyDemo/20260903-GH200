name: Lab05 Promote to Production

# 目的地：.github/workflows/lab05-deploy-prod.yml
#
# build once, promote：
#   guard       → 驗證 confirm=deploy 與 build_sha 是否為合法的 40 字元十六進位
#   deploy-prod → 只用 actions:read 找出 workflow 04 已經跑成功的那個 run，
#                 下載它的 simpleweb-jar，完全不重新 build、也不重新部署 test，
#                 再用 SSH 部署到 production 並用 systemctl 重啟服務
#
# 目標環境契約（不可改）：
#   prod → simpleweb-prod，8081，/opt/simpleweb/prod/simpleweb.jar
#          （注意目錄是 prod，不是 production；environment 名稱才是 production）

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 輸入 deploy 以確認要部署到正式環境
        required: true
        default: ''
      build_sha:
        description: 要 promote 的完整 40 字元 commit SHA
        required: true

permissions: {}

concurrency:
  group: simpleweb-lab-deploy
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        env:
          CONFIRM: ${{ inputs.confirm }}
          REQUESTED_SHA: ${{ inputs.build_sha }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "deploy" ]; then
            echo "請在觸發時輸入 deploy 以確認。" >&2
            exit 1
          fi
          if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "輸入的 build SHA 格式無效，必須是 40 字元小寫十六進位完整 SHA。" >&2
            exit 1
          fi

  deploy-prod:
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      actions: read
    # production 環境掛了 required reviewer，這個 job 會停在 Waiting 直到核准。
    environment:
      name: production
      url: http://${{ vars.VM_PUBLIC_IP }}:8081/
    steps:
      - name: Locate successful test deployment artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ inputs.build_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$BUILD_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "輸入的 build SHA 格式無效，必須是 40 字元小寫十六進位完整 SHA。" >&2
            exit 1
          fi
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow 04.deploy-test.yml \
            --commit "$BUILD_SHA" \
            --status success \
            --limit 20 \
            --json databaseId,headSha,conclusion \
            --jq "map(select(.headSha == \"$BUILD_SHA\" and .conclusion == \"success\")) | first | .databaseId // \"\"")"
          if [ -z "$run_id" ]; then
            echo "找不到 build_sha=$BUILD_SHA 對應的成功 workflow 04 run；請先部署測試環境並確認它成功。" >&2
            exit 1
          fi
          mkdir -p dist
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name simpleweb-jar --dir dist; then
            echo "workflow 04 run $run_id 沒有可下載的 simpleweb-jar artifact。" >&2
            exit 1
          fi
          test -f dist/simpleweb.jar
      - name: Set up pinned SSH identity
        id: ssh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.VM_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/simpleweb-ssh"
          mkdir -p "$ssh_dir"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_deploy"
          printf '%s\n' "$SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          echo "key_file=$ssh_dir/id_deploy" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"
      - name: Deploy to production over SSH
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          VM_USER: ${{ vars.VM_SSH_USER }}
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
          EXPECTED_SHA: ${{ inputs.build_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$KEY_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )
          if ! [[ "$VM_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "vars.VM_SSH_USER 格式無效。" >&2; exit 1
          fi
          if ! [[ "$VM_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "vars.VM_PUBLIC_IP 必須是 IPv4 位址。" >&2; exit 1
          fi
          remote_jar="simpleweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}.jar"
          scp "${ssh_opts[@]}" -- ./dist/simpleweb.jar "$VM_USER@$VM_HOST:$remote_jar"
          ssh "${ssh_opts[@]}" -- "$VM_USER@$VM_HOST" bash -s -- "$remote_jar" "/opt/simpleweb/prod/simpleweb.jar" "simpleweb-prod" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staged_jar="$1"; target_jar="$2"; service_name="$3"
          trap 'rm -f -- "$HOME/$staged_jar"' EXIT
          if [ -f "$target_jar" ]; then
            sudo cp -- "$target_jar" "${target_jar}.previous"
          fi
          sudo install -o simpleweb -g simpleweb -m 0644 "$HOME/$staged_jar" "$target_jar"
          sudo systemctl restart "$service_name"
          sleep 5
          sudo systemctl is-active "$service_name"
          REMOTE_SCRIPT
      - name: Clean up SSH key
        if: always()
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
        run: rm -f -- "$KEY_FILE"
      - name: Smoke test production 環境
        shell: bash
        env:
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
          EXPECTED_SHA: ${{ inputs.build_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            body="$(curl -fsS --max-time 5 "http://$VM_HOST:8081/api/info" || true)"
            actual="$(BODY="$body" python3 -c 'import json,os;print(json.loads(os.environ["BODY"])["buildSha"])' 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then echo "$body"; exit 0; fi
            echo "等待 production 服務更新中... ($i/12)"; sleep 5
          done
          echo "production 環境未回報預期的 build SHA：$EXPECTED_SHA" >&2; exit 1
      - name: Summary
        if: always()
        run: |
          {
            echo "## Lab05 Production 部署"
            echo ""
            echo "- 核准者：需經由 environment \`production\` 的 required reviewer"
            echo "- 來源：workflow 04 成功 run 的 simpleweb-jar artifact（沒有重新 build）"
            echo "- Service: \`simpleweb-prod\`（port 8081）"
            echo "- URL: http://${{ vars.VM_PUBLIC_IP }}:8081/"
            echo "- 版本：\`${{ inputs.build_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
