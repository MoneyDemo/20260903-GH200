name: Lab05 Promote to Production

# 目的地：.github/workflows/lab05-deploy-prod.yml
#
# 建立在 Lab04 之上：build once, deploy many。
#   build      → 產生並上傳同一份 jar（烤好 build metadata）
#   deploy-test→ 自動用 SSH 部署到 :8080
#   deploy-prod→ production Environment 掛了 required reviewer，會停下等核准，
#                核准後才用 SSH 部署「同一份」jar 到 :8081（不重新 build）
#
# 目標環境契約（不可改）：
#   test → simpleweb-test，8080，/opt/simpleweb/test/simpleweb.jar
#   prod → simpleweb-prod，8081，/opt/simpleweb/prod/simpleweb.jar
#          （注意目錄是 prod，不是 production；environment 名稱才是 production）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simpleweb-lab-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./mvnw -B verify -Dapp.build.sha="$GITHUB_SHA" -Dapp.build.time="$(date -u +%FT%TZ)"
      - name: Upload deployable jar
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error

  deploy-test:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080/
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: simpleweb-jar
          path: ./dist
      - name: Set up pinned SSH identity
        id: ssh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.VM_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/simpleweb-ssh"
          mkdir -p "$ssh_dir"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_deploy"
          printf '%s\n' "$SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          echo "key_file=$ssh_dir/id_deploy" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"
      - name: Deploy to test over SSH
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          VM_USER: ${{ vars.VM_SSH_USER }}
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$KEY_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )
          if ! [[ "$VM_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "vars.VM_SSH_USER 格式無效。" >&2; exit 1
          fi
          if ! [[ "$VM_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "vars.VM_PUBLIC_IP 必須是 IPv4 位址。" >&2; exit 1
          fi
          remote_jar="simpleweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-test.jar"
          scp "${ssh_opts[@]}" -- ./dist/simpleweb.jar "$VM_USER@$VM_HOST:$remote_jar"
          ssh "${ssh_opts[@]}" -- "$VM_USER@$VM_HOST" bash -s -- "$remote_jar" "/opt/simpleweb/test/simpleweb.jar" "simpleweb-test" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staged_jar="$1"; target_jar="$2"; service_name="$3"
          trap 'rm -f -- "$HOME/$staged_jar"' EXIT
          sudo install -o simpleweb -g simpleweb -m 0644 "$HOME/$staged_jar" "$target_jar"
          sudo systemctl restart "$service_name"
          sleep 5
          sudo systemctl is-active "$service_name"
          REMOTE_SCRIPT
      - name: Clean up SSH key
        if: always()
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
        run: rm -f -- "$KEY_FILE"
      - name: Smoke test test 環境
        shell: bash
        env:
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            body="$(curl -fsS --max-time 5 "http://$VM_HOST:8080/api/info" || true)"
            actual="$(BODY="$body" python3 -c 'import json,os;print(json.loads(os.environ["BODY"])["buildSha"])' 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then echo "$body"; exit 0; fi
            echo "等待 test 服務更新中... ($i/12)"; sleep 5
          done
          echo "test 環境未回報預期的 build SHA：$EXPECTED_SHA" >&2; exit 1

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [build, deploy-test]
    # production 環境掛了 required reviewer，這個 job 會停在 Waiting 直到核准。
    environment:
      name: production
      url: http://${{ vars.VM_PUBLIC_IP }}:8081/
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: simpleweb-jar
          path: ./dist
      - name: Set up pinned SSH identity
        id: ssh
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ vars.VM_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/simpleweb-ssh"
          mkdir -p "$ssh_dir"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_deploy"
          printf '%s\n' "$SSH_HOST_KEY" > "$ssh_dir/known_hosts"
          echo "key_file=$ssh_dir/id_deploy" >> "$GITHUB_OUTPUT"
          echo "known_hosts=$ssh_dir/known_hosts" >> "$GITHUB_OUTPUT"
      - name: Deploy to production over SSH
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS: ${{ steps.ssh.outputs.known_hosts }}
          VM_USER: ${{ vars.VM_SSH_USER }}
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$KEY_FILE"
            -o GlobalKnownHostsFile=/dev/null
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS"
          )
          if ! [[ "$VM_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]{0,31}$ ]]; then
            echo "vars.VM_SSH_USER 格式無效。" >&2; exit 1
          fi
          if ! [[ "$VM_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "vars.VM_PUBLIC_IP 必須是 IPv4 位址。" >&2; exit 1
          fi
          remote_jar="simpleweb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-prod.jar"
          scp "${ssh_opts[@]}" -- ./dist/simpleweb.jar "$VM_USER@$VM_HOST:$remote_jar"
          ssh "${ssh_opts[@]}" -- "$VM_USER@$VM_HOST" bash -s -- "$remote_jar" "/opt/simpleweb/prod/simpleweb.jar" "simpleweb-prod" <<'REMOTE_SCRIPT'
          set -euo pipefail
          staged_jar="$1"; target_jar="$2"; service_name="$3"
          trap 'rm -f -- "$HOME/$staged_jar"' EXIT
          sudo install -o simpleweb -g simpleweb -m 0644 "$HOME/$staged_jar" "$target_jar"
          sudo systemctl restart "$service_name"
          sleep 5
          sudo systemctl is-active "$service_name"
          REMOTE_SCRIPT
      - name: Clean up SSH key
        if: always()
        shell: bash
        env:
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
        run: rm -f -- "$KEY_FILE"
      - name: Smoke test production 環境
        shell: bash
        env:
          VM_HOST: ${{ vars.VM_PUBLIC_IP }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            body="$(curl -fsS --max-time 5 "http://$VM_HOST:8081/api/info" || true)"
            actual="$(BODY="$body" python3 -c 'import json,os;print(json.loads(os.environ["BODY"])["buildSha"])' 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then echo "$body"; exit 0; fi
            echo "等待 production 服務更新中... ($i/12)"; sleep 5
          done
          echo "production 環境未回報預期的 build SHA：$EXPECTED_SHA" >&2; exit 1
      - name: Summary
        if: always()
        run: |
          {
            echo "## Lab05 Production 部署"
            echo ""
            echo "- 核准者：需經由 environment \`production\` 的 required reviewer"
            echo "- Service: \`simpleweb-prod\`（port 8081）"
            echo "- URL: http://${{ vars.VM_PUBLIC_IP }}:8081/"
            echo "- 版本：\`${{ github.sha }}\`（與 test 部署的是同一份 jar）"
          } >> "$GITHUB_STEP_SUMMARY"
